name: Extract Android Wrapper
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and flatten into target folder
        shell: bash
        run: |
          shopt -s nullglob dotglob
          ZIPS=(*.zip)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "No .zip archive found at repository root; nothing to extract."
            exit 1
          fi
          ZIP_FILE="${ZIPS[0]}"
          mkdir -p temp_extract android-wrapper
          unzip -o "$ZIP_FILE" -d temp_extract
          TOP_ITEMS=(temp_extract/*)
          if [ ${#TOP_ITEMS[@]} -eq 1 ] && [ -d "${TOP_ITEMS[0]}" ]; then
            cp -a "${TOP_ITEMS[0]}/." android-wrapper/
          else
            cp -a temp_extract/. android-wrapper/
          fi
          rm -rf temp_extract "$ZIP_FILE"
      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No extracted file changes to commit."
          else
            git commit -m "Add Android wrapper files"
            git push
          fi
