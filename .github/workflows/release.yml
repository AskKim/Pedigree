name: Release PWA & Android Bundle

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version tag/label (e.g. v0.1.0-alpha.2; defaults to tag or package.json version)"
        required: false
        default: ""
        type: string
      publish_github_release:
        description: "Also create an official GitHub Release & tag on the selected branch"
        required: false
        default: false
        type: boolean
      mark_prerelease:
        description: "Mark the GitHub Release as a pre-release (auto-enabled for -alpha/-beta/-rc)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pwa:
    name: Verify, Build & Package PWA Bundle
    runs-on: ubuntu-latest
    outputs:
      bundle_name: ${{ steps.package.outputs.bundle_name }}
      tag_version: ${{ steps.package.outputs.tag_version }}
      safe_repo: ${{ steps.package.outputs.safe_repo }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Verify cross-file version alignment
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          node -e '
            const fs = require("fs");
            const pkgVer = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const manifestVer = JSON.parse(fs.readFileSync("public/version.json", "utf8")).appVersion;
            const gateSrc = fs.readFileSync("src/domain/upgradeGate.ts", "utf8");
            const gateMatch = gateSrc.match(/CURRENT_APP_VERSION\s*=\s*[\x27"]([^\x27"]+)[\x27"]/);
            const gradleSrc = fs.readFileSync("android-wrapper/app/build.gradle.kts", "utf8");
            const gradleMatch = gradleSrc.match(/versionName\s*=\s*"([^"]+)"/);
            const versions = {
              packageJson: pkgVer,
              versionJson: manifestVer,
              upgradeGate: gateMatch ? gateMatch[1] : null,
              androidGradle: gradleMatch ? gradleMatch[1] : null,
            };
            console.log("Release version check:", JSON.stringify(versions));
            const unique = new Set(Object.values(versions));
            if (unique.size !== 1 || !pkgVer) {
              console.error("ERROR: Version mismatch across release manifests!", versions);
              process.exit(1);
            }
            const refType = process.env.REF_TYPE || "";
            const refName = process.env.REF_NAME || "";
            if (refType === "tag" && refName.startsWith("v") && refName !== `v${pkgVer}`) {
              console.error(`ERROR: Git tag "${refName}" does not match package.json version "v${pkgVer}"!`);
              process.exit(1);
            }
          '

      - name: Run unit tests, improvement verification & TypeScript lint
        run: |
          npm test
          npm run verify:improvements
          npm run lint

      - name: Build production PWA bundle (root path)
        env:
          NODE_ENV: production
        run: npm run build -- --base=/

      - name: Package release ZIP and SHA-256 checksum
        id: package
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          INPUT_VERSION: ${{ inputs.release_version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          RELEASE_DATE=$(date -u +"%Y-%m-%d")
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            VERSION="$REF_NAME"
          else
            VERSION="v${PKG_VERSION}"
          fi
          case "$VERSION" in
            v*) TAG_VERSION="$VERSION" ;;
            *) TAG_VERSION="v${VERSION}" ;;
          esac
          SAFE_REPO="${REPO_NAME:-Pedigree}"
          BUNDLE_NAME="${SAFE_REPO}-pwa-${TAG_VERSION}-${RELEASE_DATE}"
          mkdir -p release_out/"$BUNDLE_NAME"
          cp -R dist/. release_out/"$BUNDLE_NAME"/
          (cd release_out && python3 -m zipfile -c "${BUNDLE_NAME}.zip" "$BUNDLE_NAME" && sha256sum "${BUNDLE_NAME}.zip" > "${BUNDLE_NAME}.zip.sha256")
          echo "bundle_name=$BUNDLE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "safe_repo=$SAFE_REPO" >> "$GITHUB_OUTPUT"
          echo "zip_path=release_out/${BUNDLE_NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "sha_path=release_out/${BUNDLE_NAME}.zip.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload verified root dist/ for Android WebView packaging
        uses: actions/upload-artifact@v4
        with:
          name: release-pwa-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

      - name: Upload PWA release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.bundle_name }}
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.sha_path }}
          if-no-files-found: error

      - name: Verify GitHub Pages subpath production build
        env:
          NODE_ENV: production
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          SUBPATH="/${REPO_NAME:-Pedigree}/"
          npm run build -- --base="$SUBPATH"
          grep -q '"start_url":"./"' dist/manifest.webmanifest
          grep -q '"scope":"./"' dist/manifest.webmanifest
          grep -q '"id":"./"' dist/manifest.webmanifest
          grep -q "${SUBPATH}assets/" dist/index.html
          grep -q "${SUBPATH}manifest.webmanifest" dist/index.html

  release-android-apk:
    name: Package Thin Android WebView APKs
    runs-on: ubuntu-latest
    needs: release-pwa
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified React PWA dist/ into Android assets/www/
        uses: actions/download-artifact@v4
        with:
          name: release-pwa-dist
          path: android-wrapper/app/src/main/assets/www

      - name: Verify offline PWA entrypoint in Android assets
        run: test -f android-wrapper/app/src/main/assets/www/index.html

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Decode release keystore if secrets are configured
        id: keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            KEYSTORE_FILE="${RUNNER_TEMP}/pedigree-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "keystore_path=$KEYSTORE_FILE" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          fi
          test -f "$SDK_DIR/licenses/android-sdk-license"

      - name: Build Debug APK
        working-directory: android-wrapper
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: android-wrapper
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Clean up temporary keystore
        if: always() && steps.keystore.outputs.keystore_path != ''
        run: rm -f "${{ steps.keystore.outputs.keystore_path }}"

      - name: Stage versioned Android APKs and SHA-256 checksums
        env:
          SAFE_REPO: ${{ needs.release-pwa.outputs.safe_repo }}
          TAG_VERSION: ${{ needs.release-pwa.outputs.tag_version }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          mkdir -p android_release_out
          DEBUG_SRC=$(find android-wrapper/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          RELEASE_SRC=$(find android-wrapper/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          test -n "$DEBUG_SRC" || { echo "Missing debug APK output" >&2; exit 1; }
          test -n "$RELEASE_SRC" || { echo "Missing release APK output" >&2; exit 1; }

          DEBUG_OUT="${SAFE_REPO}-android-${TAG_VERSION}-debug.apk"
          if [ "$SIGNED" = "true" ]; then
            RELEASE_OUT="${SAFE_REPO}-android-${TAG_VERSION}-release.apk"
          else
            RELEASE_OUT="${SAFE_REPO}-android-${TAG_VERSION}-release-unsigned.apk"
          fi

          cp "$DEBUG_SRC" "android_release_out/$DEBUG_OUT"
          cp "$RELEASE_SRC" "android_release_out/$RELEASE_OUT"
          (cd android_release_out && sha256sum "$DEBUG_OUT" > "${DEBUG_OUT}.sha256" && sha256sum "$RELEASE_OUT" > "${RELEASE_OUT}.sha256")
          ls -lh android_release_out/

      - name: Upload Android release APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android-apks
          path: android_release_out/*
          if-no-files-found: error

  publish-github-release:
    name: Publish Official GitHub Release
    runs-on: ubuntu-latest
    needs: [release-pwa, release-android-apk]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_github_release
    steps:
      - name: Download PWA release archive
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.release-pwa.outputs.bundle_name }}
          path: release_assets

      - name: Download Android APK release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-android-apks
          path: release_assets

      - name: Create or update GitHub Release (PWA ZIP + Android APKs + SHA-256 checksums)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-pwa.outputs.tag_version }}
          TARGET_SHA: ${{ github.sha }}
          MARK_PRERELEASE: ${{ inputs.mark_prerelease }}
        run: |
          ls -lh release_assets/
          EXTRA_ARGS=()
          if [ "$MARK_PRERELEASE" = "true" ] || echo "$TAG_NAME" | grep -qiE -- '-(alpha|beta|rc)'; then
            EXTRA_ARGS+=(--prerelease)
          fi
          if gh release view "$TAG_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; uploading refreshed assets with --clobber..."
            gh release upload "$TAG_NAME" release_assets/* --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG_NAME" release_assets/* \
              --repo "$GH_REPO" \
              --target "$TARGET_SHA" \
              --title "Community Pedigree $TAG_NAME" \
              --generate-notes \
              "${EXTRA_ARGS[@]}"
          fi
