name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - alpha-1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build subpath-safe product
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          bun run build
          test -f dist/robots.txt || { echo "Missing dist/robots.txt" >&2; exit 1; }
          test -f dist/sitemap.xml || { echo "Missing dist/sitemap.xml" >&2; exit 1; }
          test -f dist/404.html || cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
