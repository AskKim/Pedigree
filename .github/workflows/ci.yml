name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Run domain unit tests
        run: npm test

      - name: Verify App Improvements Registry
        run: npm run verify:improvements

      - name: Verify layer boundaries and engine typecheck
        run: |
          npm run verify:layers
          npm run verify:engine
          npm run verify:extraction

      - name: Run TypeScript typecheck (lint)
        run: npm run lint

      - name: Build production bundle (root path)
        env:
          NODE_ENV: production
        run: npm run build

      - name: Verify GitHub Pages subpath build
        env:
          NODE_ENV: production
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="CPP2"
          fi
          SUBPATH="/${REPO_NAME}/"
          npm run build -- --base="$SUBPATH"
          test -f dist/robots.txt || { echo "Missing dist/robots.txt" >&2; exit 1; }
          test -f dist/sitemap.xml || { echo "Missing dist/sitemap.xml" >&2; exit 1; }
          test -f dist/404.html || cp dist/index.html dist/404.html
          grep -q '"start_url":"./"' dist/manifest.webmanifest
          grep -q '"scope":"./"' dist/manifest.webmanifest
          grep -q '"id":"./"' dist/manifest.webmanifest
          grep -q "${SUBPATH}assets/" dist/index.html
          grep -q "${SUBPATH}manifest.webmanifest" dist/index.html
