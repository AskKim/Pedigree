<!doctype html>
<!--
  Community Pedigree Project - GitHub Pages SPA Fallback
  Ensures direct routes and deep links reload cleanly on GitHub Pages.
-->
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting to Community Pedigree...</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        var repoSegment = '/Pedigree/';
        var targetBase = path.indexOf(repoSegment) !== -1 ? repoSegment : '/';
        window.location.replace(targetBase + search + hash);
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=/Pedigree/" />
  </head>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 48px 24px; background: #141814; color: #f2e9da;">
    <h1 style="font-size: 20px; font-weight: 600;">Redirecting to Community Pedigree...</h1>
    <p style="margin-top: 12px; font-size: 14px; color: #9ca3af;">
      If you are not redirected automatically, <a href="/Pedigree/" style="color: #4ade80; text-decoration: underline;">click here to open Community Pedigree</a>.
    </p>
  </body>
</html>
